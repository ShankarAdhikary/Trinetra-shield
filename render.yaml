# Render Blueprint - Infrastructure as Code
# This file configures automatic deployment on Render

services:
  # Backend API Service
  - type: web
    name: trinetra-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
    autoDeploy: true
