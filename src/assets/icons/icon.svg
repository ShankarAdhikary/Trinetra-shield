<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2"/>
      <stop offset="100%" style="stop-color:#357ABD"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="100%" style="stop-color:#E09000"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)"/>
  <!-- Eye shape -->
  <ellipse cx="64" cy="64" rx="40" ry="25" fill="white"/>
  <!-- Iris -->
  <circle cx="64" cy="64" r="20" fill="url(#eyeGrad)"/>
  <!-- Pupil -->
  <circle cx="64" cy="64" r="10" fill="#2C3E50"/>
  <!-- Light reflection -->
  <circle cx="58" cy="58" r="4" fill="white" opacity="0.8"/>
  <!-- Third eye rays -->
  <g stroke="#F5A623" stroke-width="2" opacity="0.6">
    <line x1="64" y1="20" x2="64" y2="30"/>
    <line x1="64" y1="98" x2="64" y2="108"/>
    <line x1="20" y1="64" x2="30" y2="64"/>
    <line x1="98" y1="64" x2="108" y2="64"/>
    <line x1="30" y1="30" x2="38" y2="38"/>
    <line x1="90" y1="90" x2="98" y2="98"/>
    <line x1="98" y1="30" x2="90" y2="38"/>
    <line x1="30" y1="98" x2="38" y2="90"/>
  </g>
</svg>
