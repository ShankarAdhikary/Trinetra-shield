<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TRINETRA</title>
    <link rel="stylesheet" href="../popup/popup.css">
    <style>
        body {
            min-width: 360px;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .login-container {
            width: 100%;
            max-width: 340px;
            padding: 24px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
        }

        .login-header h1 {
            color: #fff;
            font-size: 24px;
            margin: 0 0 8px 0;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0;
        }

        .auth-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .auth-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .auth-tab.active {
            background: #3b82f6;
            color: #fff;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s, background 0.2s;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .phone-input-group {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 80px;
            flex-shrink: 0;
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn-auth:hover {
            background: #2563eb;
        }

        .btn-auth:active {
            transform: scale(0.98);
        }

        .btn-auth:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .captcha-container {
            margin: 16px 0;
            display: flex;
            justify-content: center;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            color: #1f2937;
        }

        .btn-google:hover {
            background: #f1f5f9;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #64748b;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-form {
            text-align: center;
            margin-top: 16px;
        }

        .toggle-form span {
            color: #94a3b8;
            font-size: 13px;
        }

        .toggle-form a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .otp-section {
            display: none;
        }

        .otp-section.active {
            display: block;
        }

        .otp-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 20px 0;
        }

        .otp-input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
        }

        .otp-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .resend-otp {
            text-align: center;
            margin-top: 12px;
        }

        .resend-otp button {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 13px;
            cursor: pointer;
        }

        .resend-otp button:disabled {
            color: #64748b;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .password-requirements {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <img src="../assets/icons/icon128.png" alt="TRINETRA" class="logo">
            <h1>TRINETRA</h1>
            <p>Your digital guardian</p>
        </div>

        <!-- Error/Success Messages -->
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="email">Email</button>
            <button class="auth-tab" data-tab="phone">Phone</button>
            <button class="auth-tab" data-tab="google">Google</button>
        </div>

        <!-- Email Form -->
        <div id="email-form" class="auth-form active">
            <form id="email-auth-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required
                        minlength="8">
                    <p class="password-requirements" id="password-requirements" style="display: none;">
                        Min 8 chars, 1 uppercase, 1 lowercase, 1 number
                    </p>
                </div>

                <div class="form-group" id="name-group" style="display: none;">
                    <label class="form-label" for="name">Your Name</label>
                    <input type="text" id="name" class="form-input" placeholder="John Doe">
                </div>

                <!-- CAPTCHA Widget (Cloudflare Turnstile) -->
                <div class="captcha-container" id="email-captcha"></div>

                <button type="submit" class="btn-auth" id="email-submit-btn">
                    Sign In
                </button>
            </form>

            <div class="toggle-form">
                <span id="toggle-text">Don't have an account?</span>
                <a href="#" id="toggle-auth-mode">Sign Up</a>
            </div>
        </div>

        <!-- Phone Form -->
        <div id="phone-form" class="auth-form">
            <!-- Phone Entry -->
            <div id="phone-entry" class="phone-section">
                <form id="phone-send-form">
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <div class="phone-input-group">
                            <input type="text" id="country-code" class="form-input country-code" value="+91"
                                placeholder="+91">
                            <input type="tel" id="phone" class="form-input" placeholder="9876543210" required
                                pattern="[0-9]{10}">
                        </div>
                    </div>

                    <!-- CAPTCHA Widget (Cloudflare Turnstile) -->
                    <div class="captcha-container" id="phone-captcha"></div>

                    <button type="submit" class="btn-auth" id="send-otp-btn">
                        Send OTP
                    </button>
                </form>
            </div>

            <!-- OTP Verification -->
            <div id="otp-entry" class="otp-section">
                <p style="text-align: center; color: #94a3b8; margin-bottom: 8px;">
                    Enter the 6-digit code sent to
                </p>
                <p id="otp-phone-display"
                    style="text-align: center; color: #fff; font-weight: 600; margin-bottom: 16px;">
                </p>

                <div class="otp-container">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]">
                </div>

                <button type="button" class="btn-auth" id="verify-otp-btn">
                    Verify OTP
                </button>

                <div class="resend-otp">
                    <button type="button" id="resend-otp-btn" disabled>
                        Resend OTP in <span id="resend-timer">30</span>s
                    </button>
                </div>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="#" id="change-phone" style="color: #3b82f6; text-decoration: none; font-size: 13px;">
                        Change phone number
                    </a>
                </div>
            </div>
        </div>

        <!-- Google Form -->
        <div id="google-form" class="auth-form">
            <p style="text-align: center; color: #94a3b8; margin-bottom: 20px;">
                Sign in with your Google account for quick and secure access
            </p>

            <button type="button" class="btn-auth btn-google" id="google-signin-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Continue with Google
            </button>

            <div class="divider">or</div>

            <p style="text-align: center; color: #64748b; font-size: 13px;">
                Use Email or Phone tabs above for other sign-in options
            </p>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>

</html>
