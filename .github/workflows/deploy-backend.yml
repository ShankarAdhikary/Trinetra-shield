name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deployment triggered on Render"
          else
            echo "RENDER_DEPLOY_HOOK secret not set - skipping deployment"
            echo "To enable auto-deploy:"
            echo "1. Go to your Render dashboard"
            echo "2. Create a new Web Service from GitHub"
            echo "3. Select your repo: ShankarAdhikary/Trinetra-shield"
            echo "4. Use root directory: backend"
            echo "5. Build command: npm install"
            echo "6. Start command: node src/server.js"
          fi
